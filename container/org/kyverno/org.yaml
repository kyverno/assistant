# Organisation file for the Kyverno pack. Everything specific to the organisation is stated here;
# core plugins read it and never mention Kyverno by name. Facts that live in a repository file
# (AGENTS.md chain, label rules, readiness checks) are read from that file, not copied here.
name: kyverno

repositories:
  - repo: kyverno/kyverno
    toolchain: go
  # later phases: kyverno/website (node), kyverno/policies (kyverno-cli, chainsaw)

agent_docs:               # globs, matched against the repository tree
  - "**/AGENTS.md"
  - ARCHITECTURE.md
  - DEVELOPMENT.md
  - REVIEW.md
  - CONTRIBUTING.md
  - .github/pr_documentation.md
  - .github/copilot-instructions.md
  - .github/instructions/*.instructions.md
  - docs/context/**

instructions_dir: .github/instructions    # files carry `applyTo:` globs in their frontmatter
codeowners: CODEOWNERS

labels:
  source: .github/labels.yml               # `rules: changed-files: any-glob-to-any-file`
  area_prefixes: ["area/"]
  kind_prefixes: ["kind/"]

readiness:
  checks_file: .github/pr-readiness-checks.yml
  attention_labels: [needs-author-action, merge-conflicts, stale, hold, workflow-approval-required]
  ready_labels: [ready-for-review, needs-review]
  # branch-wide gates and infra checks, mirrored from pr-readiness-checks.yml; not the author's to fix
  infra_checks: ["E2E Gate", "Sync E2E Gate status", "Upload coverage to Codecov"]

# File-name endings that mean a test here, on top of the usual ones (_test.go, _test.py, .test.ts, .spec.ts, ...).
test_files: [kyverno-test.yaml, chainsaw-test.yaml]

entry_labels: ["good first issue", "help wanted", "Contribfest"]
# Reserved for a program with its own rules (the maintainers ask for no PRs until a mentorship begins); never offered.
reserved_labels: ["LFX mentorship project"]

review_bots:
  - copilot-pull-request-reviewer
  - coderabbitai

ladder:
  source_repo: kyverno/community
  source_path: GOVERNANCE.md
  # Blob sha of GOVERNANCE.md when the criteria below were last checked against it. The journey tool
  # reports a mismatch so stale criteria are visible.
  verified_blob_sha: aa08d86a054c19c5123026625ce629cb84be515b
  roles:
    contributor:
      needs:
        total_contributions: 5
        merged_prs: 3                      # any repository in the kyverno org
        other_contribution_kinds: [merged_pr, issue_or_pr_collaboration, blog_or_tutorial, slack_support]
      self_reported: [slack_member, attended_meeting, mailing_list]   # only the contributor can state these
      recognition: "PR adding yourself to CONTRIBUTORS.md; Credly badge"
    reviewer:
      requires: [contributor]
      signals: [reviews_on_multiple_prs, actively_reviews_others_code, active_in_discussions, appointed_by_maintainer]
      recognition: "triage access, REVIEWERS.md, CODEOWNERS areas"
    maintainer:
      requires: [reviewer]
      needs: {significant_merged_prs: "8 to 10, any repositories in the kyverno org"}
      signals: [significant_merged_prs, regular_meeting_attendance, supermajority_vote]
      recognition: "write access"
  org: kyverno                             # org scope for contribution counting
  # Repositories that do not count as contributions to the project (tooling and test repos).
  ignore_repos: [kyverno/assistant, kyverno/test-ai-assistants]

# Paths that say nothing about what someone knows (generated or bookkeeping); substring match.
noise_paths: [go.mod, go.sum, zz_generated, /crds/, CHANGELOG, docs/user/crd, charts/, vendor/]

# ---- Read by the maintainer assistant (plugins and skills); the contributor ignores these keys ----
maintainer:
  # Bots whose approval counts as one review signal in the queue order (not a substitute for a human).
  approval_bots: [coderabbitai]

  # Branch-wide merge gates: while one is open, every PR targeting the branch is blocked, whatever it touches.
  # Leave the list empty if the repository has no such gate; the gate logic is then off.
  branch_gates:
    - name: e2e-gate
      status_context: "E2E Gate"          # the commit status; kept out of a PR's own CI state
      failure_issue_label: e2e-failure    # an open issue with this label means the gate is red
      branch_marker: '<!-- workflow-failure:[^:]*:refs/heads/(?P<branch>[^\s]+) -->'   # in the issue body; none = every branch
      bypass_label: e2e-gate-bypass       # the maintainer's own decision; the assistant never applies it

  # How a changed file is classified, highest tier first. Globs match the repository path; a pattern with
  # no "/" matches the file name at any depth.
  file_classes:
    generated:
      - zz_generated.deepcopy.go
      - zz_generated.register.go
      - "pkg/client/**"
      - "pkg/clients/**/*.generated.go"
      - "config/crds/**/*.yaml"
      - "cmd/cli/kubectl-kyverno/config/crds/**"
      - "cmd/cli/kubectl-kyverno/data/crds/**"
      - "charts/kyverno/charts/crds/templates/**"
      - "charts/**/README.md"
      - "docs/user/crd/**"
      - pkg/config/mocks/mock_config.go
      - config/install-latest-testing.yaml
    generated_exceptions: [pkg/clients/dclient/client.go]   # hand-written files inside a generated directory
    api_surface: ["api/kyverno/**", "api/policyreport/**", "api/reports/**"]
    critical: ["pkg/engine/**", "pkg/webhooks/**", "pkg/cel/**"]   # elevated risk after merge
    test_only: ["*_test.go", "test/**", "**/testdata/**", "**/_testdata/**"]

  # What feeds the generated files: a PR touching an input must merge before one touching the output.
  generated_inputs:
    paths: ["api/**/*_types.go"]
    dependency_modules: [github.com/kyverno/api]   # a go.mod bump of one of these is also an input change

  # Dependency bumps that need regenerated output in the same PR.
  dependency_bots:
    codegen_module_globs: ["k8s.io/*", "sigs.k8s.io/*", "github.com/kyverno/api"]
    codegen_kind_label: kind/codegen

  milestones:
    title_format: "Kyverno Release X.Y.Z"
    open_milestone_label: milestone-pr      # the PR closes an issue under a still-open milestone
    # Set by hand on an issue to mark urgency toward a milestone; not applied by any workflow.
    issue_urgency_labels: [release-critical, release-high, release-medium, release-low]
