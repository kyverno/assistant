version: 1

# Policy for the whole assistant sandbox (Hermes and its terminal run inside it).
# Filesystem rules are fixed when the sandbox is created; network rules reload on a live sandbox.

filesystem_policy:
  include_workdir: true
  # /opt/hermes (Hermes' code) and /opt/kyverno (the baked profile) stay read-only.
  read_only: [/usr, /lib, /bin, /sbin, /etc, /proc, /dev/urandom, /app, /var/log, /opt/hermes, /opt/kyverno]
  # /opt/hermes-home is Hermes' home: profile, state, memory and its dependency environment.
  read_write: [/sandbox, /tmp, /dev/null, /opt/hermes-home]
landlock:
  compatibility: hard_requirement

# Anything not listed here is denied. The GitHub PAT's endpoints (REST and GraphQL reads, the GitHub
# MCP server) come from the provider profile, container/providers/repo-github.yaml.
network_policies:

  # The agent's terminal: read-only GitHub with no credential, for reproducing issues.
  github_read:
    name: github_read
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**/git-upload-pack" }
      - host: codeload.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: raw.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/git }
      - { path: /usr/lib/git-core/git-remote-https }

  # Toolchains and dependencies, for building and testing code in the sandbox (container/kyverno-workspace): Go and
  # Node releases, Go modules (through the module mirror and its checksum database), npm packages, and the Kyverno CLI
  # and Chainsaw release files. Read-only (GET), and only the programs that download them may reach these hosts.
  toolchains:
    name: toolchains
    endpoints:
      - host: go.dev
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/dl/**" }
      - host: dl.google.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/go/**" }
      - host: proxy.golang.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      # The module mirror redirects module files to its storage bucket.
      - host: storage.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/proxy-golang-org-prod/**" }
      - host: sum.golang.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: nodejs.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/dist/**" }
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      # GitHub serves release files from these hosts after a redirect from github.com.
      - host: release-assets.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: objects.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /sandbox/.toolchains/go/bin/go }
      - { path: /sandbox/.toolchains/node/bin/node }

  # GitHub Copilot sign-in (device code), done by Hermes' own login. Only these two login paths.
  copilot_login:
    name: copilot_login
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/login/device/code" }
          - allow: { method: POST, path: "/login/oauth/access_token" }
    binaries:
      - { path: "/opt/hermes-home/.hermes/tools/python-*/bin/python*" }

  # GitHub Copilot as the model: inference and model lists. Hermes holds its own Copilot token.
  copilot_inference:
    name: copilot_inference
    endpoints:
      # api.githubcopilot.com also hosts the GitHub MCP server (/mcp/), which the repo-github provider profile checks
      # tool by tool. OpenShell admits a request if any rule for the host admits it, so these rules must not cover
      # /mcp/: an allow-all here would let every tool call through, merges included. Hence the inference paths by name.
      - host: api.githubcopilot.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/models" }
          - allow: { method: GET, path: "/models/**" }
          - allow: { method: POST, path: "/chat/completions" }
          - allow: { method: POST, path: "/responses" }
          - allow: { method: POST, path: "/responses/**" }
          - allow: { method: POST, path: "/embeddings" }
          - allow: { method: POST, path: "/v1/**" }
      - host: api.individual.githubcopilot.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: api.business.githubcopilot.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: api.enterprise.githubcopilot.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: "/opt/hermes-home/.hermes/tools/python-*/bin/python*" }

  # The model catalog Hermes reads to build its /model list. Read-only, no credential.
  model_catalog:
    name: model_catalog
    endpoints:
      - host: models.dev
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
    binaries:
      - { path: "/opt/hermes-home/.hermes/tools/python-*/bin/python*" }
