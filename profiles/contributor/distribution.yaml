name: contributor-assistant
version: 0.1.0
description: "A coach for people contributing to an open-source project: finds work worth doing, explains how the code fits together, prepares evidence-backed PRs, makes review feedback understandable, and tracks the path from first PR to reviewer"
hermes_requires: ">=0.12.0"
author: "Suhaani Agarwal"
license: "Apache-2.0"

env_requires:
  - name: REPO_GITHUB_TOKEN
    description: "Your own fine-grained PAT. Public repositories (read-only) reads everything; add Issues read/write on the upstream repo only to let the assistant comment on issues. No Contents write, no admin."
    required: true
  - name: CONTRIBUTOR_GITHUB_LOGIN
    description: "Your GitHub username: used to find your PRs, reviews and journey"
    required: true
  - name: ASSISTANT_REPO
    description: "owner/repo you contribute to (for example your-org/your-repo)"
    required: true
  - name: ANTHROPIC_API_KEY
    description: "Optional. Anthropic API key; or choose any provider with `hermes -p contributor model`."
    required: false
  - name: COPILOT_GITHUB_TOKEN
    description: "Optional. Copilot PAT (Copilot Requests permission), or sign in with `hermes -p contributor model`."
    required: false
