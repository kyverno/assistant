# kyverno-contributor: Hermes profile config for a contributor to the Kyverno project.
#
# Security-critical, hand-edited only. The contributor profile can read GitHub widely and write exactly one
# thing: a comment on an issue or PR (add_issue_comment), checked by hooks/contributor-guard.py. It has no tool to
# merge, approve, review, push or delete, and replies to reviewers are drafts the contributor posts.
#
#   1. mcp_servers.github.headers (X-MCP-Tools): the hosted server never advertises any other tool.
#      scripts/install.sh checks that this list equals tools.include.
#   2. mcp_servers.github.tools.include: Hermes' own per-tool filter, the same list.
#   3. hooks.pre_tool_call: shell hooks, all fail_closed (a crash or timeout blocks instead of allowing).

model:
  default: "anthropic/claude-sonnet-4-6"

mcp_servers:
  github:
    url: https://api.githubcopilot.com/mcp/
    headers:
      Authorization: "Bearer ${REPO_GITHUB_TOKEN}"
      X-MCP-Tools: "search_pull_requests,pull_request_read,issue_read,search_issues,list_issues,list_label,get_label,get_file_contents,get_repository_tree,search_code,get_commit,list_commits,list_branches,list_tags,list_releases,get_latest_release,list_pull_requests,search_repositories,search_users,get_me,semantic_issue_similarity_search,actions_list,actions_get,get_job_logs,list_discussion_categories,list_discussions,get_discussion,get_discussion_comments,add_issue_comment"
    supports_parallel_tool_calls: true
    tools:
      # Reads: PRs, issues, files and the tree (the agent can read any code without a clone), commits,
      # code search, CI runs and logs, Discussions. add_issue_comment is the only write.
      include:
        - search_pull_requests
        - pull_request_read
        - issue_read
        - search_issues
        - list_issues
        - list_label
        - get_label
        - get_file_contents
        - get_repository_tree
        - search_code
        - get_commit
        - list_commits
        - list_branches
        - list_tags
        - list_releases
        - get_latest_release
        - list_pull_requests
        - search_repositories
        - search_users
        - get_me
        - semantic_issue_similarity_search
        - actions_list
        - actions_get
        - get_job_logs
        - list_discussion_categories
        - list_discussions
        - get_discussion
        - get_discussion_comments
        - add_issue_comment

custom_toolsets:
  kyverno-contributor-tools:
    - mcp-github
    # profiles/contributor/plugins/contributor: knowledge_for, explain_path, related_prs, find_issues,
    # issue_history, my_pr_state, journey_summary, journey_note, journey_self_report, inbox_read.
    - kyverno-contributor

toolsets: ["kyverno-contributor-tools"]

# `toolsets:` only scopes MCP tool grants. Hermes' built-in tools (terminal, file, browser, ...) are off
# unless listed here; scripts/install.sh adds terminal and file only when the OpenShell sandbox is set up.
platform_toolsets:
  cli:
    - memory
    - skills
    - todo
    - session_search
    - clarify
    - cronjob

hooks:
  pre_tool_call:
    - matcher: ".*(merge|delete|force_push|review_write|approve|request_copilot|pull_request_review|add_issue_comment|update_issue_comment).*"
      command: "./hooks/contributor-guard.py"
      timeout: 20
      fail_closed: true
    # Terminal and file tools may only run inside the OpenShell sandbox.
    - matcher: "terminal|process_manage|read_file|write_file|patch|search_files"
      command: "./hooks/require-sandbox-terminal.sh"
      timeout: 10
      fail_closed: true
    # git push goes to the user's own fork only, never forced, never to main (the network policy cannot see inside a push).
    - matcher: "terminal"
      command: "./hooks/git-push-guard.py"
      timeout: 10
      fail_closed: true
    - matcher: "mnemosyne_triple_add"
      command: "./hooks/block-mnemosyne-triples.sh"
      timeout: 10
      fail_closed: true

memory:
  memory_enabled: true
  user_profile_enabled: true
  # Local-only (SQLite). Every write is staged for the contributor's yes/no (/memory pending).
  provider: mnemosyne
  write_approval: true

skills:
  write_approval: true
  guard_agent_created: true

plugins:
  enabled:
    - mnemosyne
    - contributor
agent: {}
