# Contributor assistant — Hermes profile config for a contributor to an open-source project.
#
# Security-critical, hand-edited only. The contributor profile can read GitHub widely and write two
# things: a comment on an issue or PR (add_issue_comment) and a pull request from the contributor's own fork
# (create_pull_request), both checked by hooks/contributor-guard.py. It has no tool to merge, approve, review or
# delete, and replies to reviewers are drafts the contributor posts.
#
#   1. mcp_servers.github.headers (X-MCP-Tools): the hosted server never advertises any other tool.
#      scripts/install.sh checks that this list equals tools.include.
#   2. mcp_servers.github.tools.include: Hermes' own per-tool filter, the same list.
#   3. hooks.pre_tool_call: shell hooks, all fail_closed (a crash or timeout blocks instead of allowing).

# The model a new install starts with. The launcher's first-run picker and /model change it; the banner shows it.
model:
  provider: "copilot"
  default: "claude-sonnet-5.5"

mcp_servers:
  github:
    url: https://api.githubcopilot.com/mcp/
    headers:
      Authorization: "Bearer ${REPO_GITHUB_TOKEN}"
      X-MCP-Tools: "pull_request_read,issue_read,get_file_contents,get_repository_tree,search_code,actions_list,actions_get,get_job_logs,get_discussion,get_discussion_comments,add_issue_comment,create_pull_request"
    supports_parallel_tool_calls: true
    tools:
      # Reads: one PR, issue or discussion, files and the tree (the agent can read any code without a clone),
      # code search, CI runs and logs. Finding issues and PRs, and history, go through the contributor plugin and
      # the clone. add_issue_comment and create_pull_request are the only writes.
      include:
        - pull_request_read
        - issue_read
        - get_file_contents
        - get_repository_tree
        - search_code
        - actions_list
        - actions_get
        - get_job_logs
        - get_discussion
        - get_discussion_comments
        - add_issue_comment
        - create_pull_request

custom_toolsets:
  contributor-tools:
    - mcp-github
    # profiles/contributor/plugins/contributor: knowledge_for, explain_path, related_prs, find_issues,
    # issue_history, my_pr_state, journey_summary, journey_note, journey_self_report, inbox_read.
    - contributor

toolsets: ["contributor-tools"]

# `toolsets:` only scopes MCP tool grants. Hermes' built-in tools (terminal, file, browser, ...) are off
# unless listed here; scripts/install.sh adds terminal and file only when the OpenShell sandbox is set up.
platform_toolsets:
  cli:
    - memory
    - skills
    - todo
    - session_search
    - clarify
    - cronjob

hooks:
  pre_tool_call:
    - matcher: ".*(merge|delete|force_push|review_write|approve|request_copilot|pull_request_review|add_issue_comment|update_issue_comment|create_pull_request).*"
      command: "./hooks/contributor-guard.py"
      timeout: 20
      fail_closed: true
    # Terminal and file tools may only run inside the OpenShell sandbox.
    - matcher: "terminal|process_manage|read_file|write_file|patch|search_files"
      command: "./hooks/require-sandbox-terminal.sh"
      timeout: 10
      fail_closed: true
    # git push goes to the user's own fork only, never forced, never to main (the network policy cannot see inside a push).
    - matcher: "terminal"
      command: "./hooks/git-push-guard.py"
      timeout: 10
      fail_closed: true
    - matcher: "mnemosyne_triple_add"
      command: "./hooks/block-mnemosyne-triples.sh"
      timeout: 10
      fail_closed: true

memory:
  memory_enabled: true
  user_profile_enabled: true
  # Local-only (SQLite). Every write is staged for the contributor's yes/no (/memory pending).
  provider: mnemosyne
  write_approval: true

skills:
  write_approval: true
  guard_agent_created: true

plugins:
  enabled:
    - mnemosyne
    - contributor
agent: {}
