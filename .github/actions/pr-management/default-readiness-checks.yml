# The readiness checks every repository gets unless it turns one off or replaces it (see README, "Readiness checks").
# Each key becomes a possible finding; `test` and `message` are jq expressions evaluated against the PR object that
# readiness.sh's detail_query fetches, with `$author` bound to the PR author's login and `$infra` to the
# `infra_checks` map from pr-management.json (check name -> why a red result is not the author's to fix).

# Every terminal-but-unsuccessful check conclusion GitHub defines, not just FAILURE/ERROR, so a timed-out or
# cancelled check doesn't slip through as "ready". NEUTRAL and SKIPPED count as successful outcomes.
dco:
  message: '"fix the DCO"'
  test: |
    [.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
      | select((.name // .context) == "DCO") | (.conclusion // .state)]
    | any(. == "FAILURE" or . == "ERROR" or . == "TIMED_OUT" or . == "ACTION_REQUIRED" or . == "CANCELLED" or . == "STALE" or . == "STARTUP_FAILURE")

# Excludes DCO (own message above) and every check named in `infra_checks`.
ci:
  message: |
    "fix the failing check(s): " + (
      [.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
        | select((.name // .context // "") as $n | $n != "DCO" and ($infra | has($n) | not))
        | select((.conclusion // .state) as $c | ["FAILURE","ERROR","TIMED_OUT","ACTION_REQUIRED","CANCELLED","STALE","STARTUP_FAILURE"] | any(. == $c))
        | (.name // .context)]
      | join(", ")
    )
  test: |
    [.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
      | select((.name // .context // "") as $n | $n != "DCO" and ($infra | has($n) | not)) | (.conclusion // .state)]
    | any(. == "FAILURE" or . == "ERROR" or . == "TIMED_OUT" or . == "ACTION_REQUIRED" or . == "CANCELLED" or . == "STALE" or . == "STARTUP_FAILURE")

# Non-blocking FYI, never needs-author-action: red checks named in `infra_checks`, which fail outside the PR's diff.
infra_checks:
  message: |
    "no action needed from you on these red check(s), they are not caused by this PR:\n" + (
      [.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
        | select((.conclusion // .state) as $c | ["FAILURE","ERROR","TIMED_OUT","ACTION_REQUIRED","CANCELLED","STALE","STARTUP_FAILURE"] | any(. == $c))
        | (.name // .context // "") as $n
        | select($infra | has($n))
        | "- `" + $n + "`: " + $infra[$n]]
      | unique | join("\n")
    ) + "\nA maintainer can re-run the failed job once the service recovers."
  test: |
    [.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
      | select((.name // .context // "") as $n | $infra | has($n)) | (.conclusion // .state)]
    | any(. == "FAILURE" or . == "ERROR" or . == "TIMED_OUT" or . == "ACTION_REQUIRED" or . == "CANCELLED" or . == "STALE" or . == "STARTUP_FAILURE")

conflicts:
  message: '"fix the merge conflicts"'
  test: |
    [.labels.nodes[].name] | any(. == "merge-conflicts")

# Per unresolved thread, not a global timestamp comparison: the author owes a response unless the LAST comment
# in that specific thread is already theirs (a fix pushed without replying still counts as owing a response).
threads:
  message: '"resolve all review comments — mark each thread resolved, or leave a response if you are not sure what to do"'
  test: |
    [.reviewThreads.nodes[]
      | select(.isResolved | not)
      | select(.comments.nodes[0].author.login != $author)
    ] | length > 0

# Only an explicit "Request changes" review asks the author to act; plain comments and comment-only reviews never do.
# Each maintainer's latest approve/request-changes/dismiss review decides (so a later approval or dismissal clears
# it), and it stays open until the author replies (comment or review) or pushes a newer commit. Maintainers are
# GitHub's OWNER, MEMBER and COLLABORATOR associations; bots and the author's own reviews are ignored.
unanswered:
  message: '"reply to the requested changes, or push a fix"'
  test: |
    def human: (.author.__typename // "") != "Bot" and ((.author.login // "") | endswith("[bot]") | not);
    ([.reviews.nodes[]? | select(human) | select(.state != "PENDING")]) as $reviews
    | ([.comments.nodes[]? | select(human) | {who: (.author.login // ""), at: .createdAt}]
       + [$reviews[] | {who: (.author.login // ""), at: .submittedAt}]) as $events
    | ([$events[] | select(.who == $author) | .at] | max // "") as $answered
    | (.commits.nodes[0].commit.committedDate // "") as $pushed
    | [$reviews | group_by(.author.login // "")[]
        | map(select(.state != "COMMENTED")) | sort_by(.submittedAt) | last // empty
        | select(.state == "CHANGES_REQUESTED" and .author.login != $author
            and (.authorAssociation == "OWNER" or .authorAssociation == "MEMBER" or .authorAssociation == "COLLABORATOR")
            and .submittedAt > $answered and .submittedAt > $pushed)]
      | length > 0
