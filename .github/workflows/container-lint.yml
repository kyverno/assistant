# Lints the sandbox's scripts and Dockerfile on every pull request that touches them. The tools run as
# containers pinned by digest, so a new release of a linter cannot change the result under us.
name: container-lint

on:
  pull_request:
    paths:
      - "Makefile"
      - "container/**"
      - "tests/image/**"
      - ".github/workflows/container-*.yml"
  push:
    branches: [main]
    paths:
      - "Makefile"
      - "container/**"
      - "tests/image/**"
      - ".github/workflows/container-*.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: lint
        run: make lint
