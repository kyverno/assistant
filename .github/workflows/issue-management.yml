# Reusable workflow: runs the issue-management action in the CALLING repository. A caller supplies the triggers and
# the permissions ceiling; everything that must be the same everywhere lives here: the trusted default-branch
# checkout, the concurrency group, the least-privilege token and the preview/live decision. See
# docs/adopting-actions.md.
#
# The action is referenced by full path and commit because a local `./` path would resolve in the caller's checkout.
# That commit is always older than this file's own; move it when the action changes.
name: Issue management (reusable)

on:
  workflow_call:
    inputs:
      dry-run:
        description: >-
          true or false, or auto to follow the ISSUE_AUTOMATION_LIVE repository variable of the calling repository
          (live only when it is exactly true)
        type: string
        default: auto
      max-actions:
        description: With a live run, the most issues one run changes
        type: string
        default: '30'

env:
  DRY_RUN: ${{ inputs.dry-run == 'auto' && (vars.ISSUE_AUTOMATION_LIVE == 'true' && 'false' || 'true') || inputs.dry-run }}

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: issue-management
      cancel-in-progress: false
    # The caller must grant at least these.
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reject unknown inputs
        env:
          DRY_RUN_INPUT: ${{ inputs.dry-run }}
          MAX_ACTIONS: ${{ inputs.max-actions }}
        run: |
          case "$DRY_RUN_INPUT" in true | false | auto) ;; *) echo "::error::dry-run must be true, false or auto"; exit 1 ;; esac
          [[ "$MAX_ACTIONS" =~ ^[1-9][0-9]*$ ]] || { echo "::error::max-actions must be a whole number"; exit 1; }
      - name: Checkout trusted configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Label, warn and close issues
        uses: kyverno/assistant/.github/actions/issue-management@7a70a2b06d1ed4f0976150deeaecf2c24d511c5d
        with:
          dry-run: ${{ env.DRY_RUN }}
          max-actions: ${{ inputs.max-actions }}
