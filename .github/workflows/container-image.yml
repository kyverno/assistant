# Builds the assistant's sandbox image (container/Dockerfile) for Apple Silicon / arm64 Linux and for
# Intel / amd64 Linux, and publishes it to the GitHub Container Registry as one multi-architecture image:
#
#   ghcr.io/<owner>/assistant:<tag>      e.g. v1.2.3, plus the floating tags v1.2, v1 and "latest"
#
# Run it by pushing a release tag (vMAJOR.MINOR.PATCH), or by hand from the Actions tab (publishes the "edge"
# tag). A tag with a suffix (v1.2.3-rc1) is published under its own name only: it does not move v1.2, v1 or
# "latest". A fixable CRITICAL vulnerability in either image stops the release before any tag is created.
# The published image is signed (cosign, keyless) and carries a build provenance attestation.
# Each architecture is built on a native runner, not emulated: the build downloads and compiles things
# for the machine it runs on, and takes about 5 minutes on a GitHub runner.
#
# One-time setup by an org admin: allow this repository to publish packages, and after the first
# publish set the package's visibility to public so that `container/kyverno` can pull it without logging in.
name: container-image

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    outputs:
      image: ${{ steps.names.outputs.image }}
      tag: ${{ steps.names.outputs.tag }}
    steps:
      - name: Work out the image name and tag
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; else tag="edge"; fi
          echo "image=ghcr.io/${owner}/assistant" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build fails by design if the memory plugin cannot load or needs the network (see the Dockerfile).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}-${{ matrix.arch }}

  manifest:
    name: publish ${{ needs.build.outputs.tag }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing and provenance (OIDC)
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The gate: nothing is released while the image has a fixable CRITICAL vulnerability. Both architectures are
      # scanned, as the per-architecture tags pushed above; "latest" and the release tag do not exist yet, so a
      # failure here leaves the previous release in place. Trivy runs as a container pinned by digest (0.76.0).
      - name: Scan for critical vulnerabilities
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for arch in amd64 arm64; do
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
              aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
              image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE}:${TAG}-${arch}"
          done

      - name: Combine the two architectures into one image
        id: publish
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          tags=(-t "${IMAGE}:${TAG}")
          # Only a stable release tag (vX.Y.Z, no suffix) moves the floating tags; a manual run publishes
          # "edge" and a pre-release such as v1.2.3-rc1 is published under its own name only.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [[ "${TAG}" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            tags+=(-t "${IMAGE}:v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" -t "${IMAGE}:v${BASH_REMATCH[1]}" -t "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Signed by digest, so every tag that points at this image is covered. Verify with:
      #   cosign verify ghcr.io/<owner>/assistant:<tag> \
      #     --certificate-identity-regexp '^https://github.com/<owner>/assistant/\.github/workflows/container-image\.yml@' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Verify with: gh attestation verify oci://ghcr.io/<owner>/assistant:<tag> --owner <owner>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
