# Reusable workflow: runs one mode of the pr-management action in the CALLING repository. A caller supplies the
# triggers, the permissions ceiling and the mode; everything that must be the same everywhere lives here: the
# trusted default-branch checkout, the concurrency groups, the least-privilege token of each mode and the
# preview/live decision. See docs/adopting-actions.md.
#
# The action is referenced by full path and commit because a local `./` path would resolve in the caller's checkout.
# That commit is always older than this file's own; move it when the action changes.
name: PR management (reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: One of labels, sync-labels, readiness, stale
        type: string
        required: true
      dry-run:
        description: >-
          true or false, or auto to follow the PR_AUTOMATION_LIVE repository variable of the calling repository
          (live only when it is exactly true)
        type: string
        default: auto

env:
  DRY_RUN: ${{ inputs.dry-run == 'auto' && (vars.PR_AUTOMATION_LIVE == 'true' && 'false' || 'true') || inputs.dry-run }}

# The caller must grant at least the union of the permissions below. Each job then holds only its own.
permissions: {}

jobs:
  check-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Reject unknown inputs
        env:
          MODE: ${{ inputs.mode }}
          DRY_RUN_INPUT: ${{ inputs.dry-run }}
        run: |
          case "$MODE" in labels | sync-labels | readiness | stale) ;; *) echo "::error::unknown mode '$MODE'"; exit 1 ;; esac
          case "$DRY_RUN_INPUT" in true | false | auto) ;; *) echo "::error::dry-run must be true, false or auto"; exit 1 ;; esac

  labels:
    if: inputs.mode == 'labels'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pr-labels-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Path labels and merge conflicts
        uses: kyverno/assistant/.github/actions/pr-management@ff202be472ba7999004f785d0db1750cb4e78c8b
        with:
          mode: labels
          dry-run: ${{ env.DRY_RUN }}

  sync-labels:
    if: inputs.mode == 'sync-labels'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sync-labels
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Sync label metadata
        uses: kyverno/assistant/.github/actions/pr-management@ff202be472ba7999004f785d0db1750cb4e78c8b
        with:
          mode: sync-labels
          dry-run: ${{ env.DRY_RUN }}

  readiness:
    if: inputs.mode == 'readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: pr-readiness
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Readiness classification
        uses: kyverno/assistant/.github/actions/pr-management@ff202be472ba7999004f785d0db1750cb4e78c8b
        with:
          mode: readiness
          dry-run: ${{ env.DRY_RUN }}

  stale:
    if: inputs.mode == 'stale'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: pr-stale-author-action
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Stale handling and reviewer reminders
        uses: kyverno/assistant/.github/actions/pr-management@ff202be472ba7999004f785d0db1750cb4e78c8b
        with:
          mode: stale
          dry-run: ${{ env.DRY_RUN }}
